# standalone/ is imported byte-for-byte from ECHO standalone 1.5.0; it is not reformatted to pass ECHO's lint gate.
extend-exclude = ["standalone"]

# The Chapter 5 analysis and figure scripts (written 2026-09-19/20) are kept exactly as they
# produced the thesis figures, so only their style findings are ignored; every other rule applies.
[lint.per-file-ignores]
"analyze_acoustics_v2.py" = ["E702", "F541"]
"analyze_bridge.py" = ["E401", "E701", "E702", "F401"]
"make_figure_d.py" = ["E401", "E702", "F401"]
"make_figures.py" = ["E401", "E402", "E701", "E702", "F401"]
"make_figures_abc.py" = ["E401", "E701", "E702", "F401"]
# figures/ holds the report-figure scripts from the evidence bundle (03 Figures), kept as written: they import
# the shared style and diagram helpers with *, keep several statements per line, and one redefines TGT on purpose.
"figures/*.py" = ["E401", "E402", "E701", "E702", "E731", "E741", "F401", "F403", "F405", "F811"]
